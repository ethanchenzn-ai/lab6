
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Mood</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="weather">

    <h1>Weather Mood ☀️</h1>
    <p>See how the weather changes your mood!</p>

    <!-- Choose a city -->
    <select id="city" onchange="getWeather()">
      <option value="43.59,-79.64">Mississauga</option>
      <option value="43.65,-79.38">Toronto</option>
      <option value="49.28,-123.12">Vancouver</option>
      <option value="35.68,139.69">Tokyo</option>
    </select>

    <!-- Weather information -->
    <div id="icon">🌤️</div>

    <h1 id="temperature">--°C</h1>
    <h2 id="description">Loading...</h2>

    <div class="details">
      <p>💨 Wind Speed: <span id="wind">--</span> km/h</p>
      <p>💧 Humidity: <span id="humidity">--</span>%</p>
    </div>

    <p id="message">How is the weather today?</p>

    <!-- Outdoor activity recommendation -->
    <div class="activity">
      <h3>Outdoor Activity Checker 🌿</h3>
      <p>Is today a good day to go outside?</p>

      <button onclick="checkOutside()">
        Should I Go Outside?
      </button>

      <p id="outsideResult">
        Click the button to find out!
      </p>
    </div>

    <!-- Refresh weather -->
    <button onclick="getWeather()">
      Refresh Weather
    </button>

    <p id="update">Last checked: --</p>

  </div>

  <footer>
    <p>Weather data from Open-Meteo</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
